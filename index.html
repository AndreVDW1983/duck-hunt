<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CMC Staffroom Duck Hunt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* One deliberate look: a printed staffroom poster in the college colours. Maroon page, white cards, gold highlights. Same in light and dark mode. */
:root {
  --maroon: #6d1a2a;
  --maroon-dark: #4a1019;
  --gold: #f0b323;
  --gold-pale: #fbefcf;
  --white: #ffffff;
  --ink: #2a0a10;
  --head: "Archivo Black", "Arial Black", Impact, sans-serif;
  --body: "Atkinson Hyperlegible", Verdana, Arial, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
img { max-width: 100%; }
html { background: var(--maroon); }
body { margin: 0; background: var(--maroon); color: var(--white); font-family: var(--body); font-size: 18px; line-height: 1.5; }
.wrap { max-width: 540px; margin: 0 auto; padding-block: 24px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.tag { display: inline-block; font-weight: 700; font-size: 15px; background: var(--gold); color: var(--maroon-dark); padding: 3px 10px; transform: rotate(-2deg); }
h1, h2 { font-family: var(--head); font-weight: 400; line-height: 1.05; margin: 10px 0 18px; text-wrap: balance; color: var(--white); }
h1 { font-size: 44px; }
h1 .gold { color: var(--gold); }
h2 { font-size: 34px; }
.card { background: var(--white); color: var(--ink); border: 3px solid var(--maroon-dark); box-shadow: 6px 6px 0 var(--gold); padding: 20px; display: grid; gap: 16px; }
.progress { font-weight: 700; font-size: 15px; color: var(--maroon); }
.riddle { font-size: 21px; font-weight: 700; margin: 0; }
p { margin: 0; }
.muted { font-size: 16px; }
form { display: flex; gap: 10px; flex-wrap: wrap; }
input { flex: 1 1 200px; min-width: 0; font: inherit; padding: 11px 12px; border: 3px solid var(--maroon-dark); border-radius: 0; background: var(--white); color: var(--ink); }
button, .start { font-family: var(--head); font-size: 18px; padding: 11px 20px; border: 3px solid var(--maroon-dark); border-radius: 0; background: var(--maroon); color: var(--gold); cursor: pointer; }
button:active, .start:active { transform: translate(2px, 2px); }
button:focus-visible, input:focus-visible, .start:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.start { display: block; text-align: center; text-decoration: none; }
.ghost { background: var(--white); color: var(--maroon); font-family: var(--body); font-weight: 700; font-size: 16px; justify-self: start; padding: 6px 12px; }
.msg { font-weight: 700; color: var(--maroon); }
.msg.bad { color: #b3261e; }
.reveal { background: var(--gold-pale); border: 3px dashed var(--maroon); padding: 14px; display: grid; gap: 8px; }
.reveal strong { font-family: var(--head); font-weight: 400; font-size: 20px; color: var(--maroon); }
.photo { width: 100%; height: auto; border: 3px solid var(--maroon-dark); display: block; }
.pond { width: 100%; height: auto; background: #bfe3f2; border: 3px solid var(--maroon-dark); display: block; }
ul { margin: 0; padding-left: 22px; display: grid; gap: 8px; }
footer { margin-top: 28px; text-align: center; font-size: 14px; font-weight: 700; color: var(--gold-pale); }
@media (prefers-reduced-motion: reduce) { button:active, .start:active { transform: none; } }
</style>
</head>
<body>

<div class="wrap">
  <main id="app" aria-live="polite"></main>
  <footer>CMC Staffroom Duck Hunt · Term 4, 2026</footer>
</div>

<script>
/* ============ EDIT THIS BLOCK FOR EACH HUNT ============
   Each hunt is a block like h1 below. To add Hunt 2, copy the whole h1 block,
   paste it after h1's closing brace and comma, rename it h2 and change the text.
   type: "riddle" or "trivia" for a typed answer, "ducks" for the counting pond.
   answers: every spelling you will accept, in lower case.
   next: what the player sees after a correct answer (where to go next).
   Optional picture: add  image: "photo-name.jpg",  and upload that photo to the
   same GitHub repository as this file.
   ======================================================= */
/* The hunt the Start button on the rules page opens. Change to "h2", "h3" and so on. */
const CURRENT_HUNT = "h2";

const HUNTS = {
  h1: {
    name: "Hunt 1",
    challenges: [
      {
        type: "riddle",
        title: "The Morning Saviour",
        prompt: "I have a spout but I never talk. I rumble and sing when I'm hot. Most of this room visits me before first bell. What am I?",
        answers: ["kettle", "the kettle", "jug", "the jug", "urn", "hot water urn", "zip", "zip tap", "boiling water tap"],
        hint: "Think tea and coffee.",
        next: "Head to the kettle. The next code is hiding close by."
      },
      {
        type: "trivia",
        title: "Back to 1966",
        prompt: "Clairvaux College opened in 1966. One of our four Houses is named after its very first principal. Which House?",
        answers: ["surawski", "surawski house", "brother surawski", "br surawski"],
        hint: "It's the purple House.",
        next: "Next stop riddle: I'm cold on the inside, full of other people's lunches, and someone has stuck a note on me asking you to take your container home. The code is with me."
      },
      {
        type: "ducks",
        title: "Graduation Day at the Pond",
        prompt: "Look closely at the pond below. How many ducks are wearing a graduation cap? (Party hats don't count.)",
        seed: 1105,
        total: 34, caps: 7, party: 5,
        hint: "A graduation cap is the flat dark square. Count slowly, row by row.",
        next: "The duck is roosting near the machine that eats paper and spits out worksheets. Find it, claim it, keep it on your desk."
      }
    ]
  },
  h2: {
    name: "Hunt 2",
    challenges: [
      {
        type: "riddle",
        title: "Caesar's Lunch Order",
        prompt: "Julius Caesar hid his messages by shifting every letter three places along the alphabet, so A became D and B became E. Decode this to find your next stop: PLFURZDYH",
        answers: ["microwave", "the microwave"],
        hint: "Every letter has taken three steps forward. Send them back where they came from.",
        next: "Head to the microwave. The next code is hiding close by. No need to reheat it."
      },
      {
        type: "riddle",
        title: "Talk Like a Computer",
        prompt: "Computers store every letter as a pattern of 0s and 1s. In this code 01000001 is A, 01000010 is B, 01000011 is C, and so on through the alphabet. Decode: 01010011 01001001 01001110 01001011",
        answers: ["sink", "the sink", "kitchen sink", "the kitchen sink"],
        hint: "Mmmm...maybe some sort of translator!!!",
        next: "Head to the sink. The next code is close by, and hopefully not under the dirty mugs."
      },
      {
        type: "spot",
        title: "Something Fishy at the Pond",
        prompt: "Pond B was copied from Pond A, but someone has been meddling. How many differences can you find between the two ponds?",
        seed: 2611,
        total: 25, caps: 5, party: 4, diffs: 5,
        answers: ["5", "five"],
        hint: "Compare one row at a time. Check for missing ducks, hats, beaks and which way each duck faces.",
        next: "Final riddle: I have a face but no eyes, and hands but I can't clap. Everyone glances at me before the bell. The duck is perched near me. Find it, claim it, keep it on your desk."
      }
    ]
  }
};
/* ======================================================= */

const app = document.getElementById("app");
const norm = s => s.toLowerCase().replace(/[^a-z0-9 ]/g, "").replace(/\s+/g, " ").trim();

function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

function pondLayout(c) {
  const r = rng(c.seed);
  const n = c.total, idx = [...Array(n).keys()];
  for (let i = n - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  const hat = {}; idx.slice(0, c.caps).forEach(i => hat[i] = "cap"); idx.slice(c.caps, c.caps + c.party).forEach(i => hat[i] = "party");
  const cols = 5, cw = 110, rh = 84, W = cols * cw, H = Math.ceil(n / cols) * rh + 20;
  const ducks = [];
  for (let i = 0; i < n; i++) {
    const x = (i % cols) * cw + 50 + (r() - .5) * 26, y = Math.floor(i / cols) * rh + 52 + (r() - .5) * 14;
    const flip = r() < .5 ? -1 : 1, s = .8 + r() * .3;
    ducks.push({ x, y, flip, s, hat: hat[i] || "", beak: "#e07b22", gone: false });
  }
  return { ducks, W, H };
}

function drawPond(L, label) {
  let g = "";
  for (const d of L.ducks) {
    if (d.gone) continue;
    let h = "";
    if (d.hat === "cap") h = `<rect x="6" y="-35" width="22" height="5" fill="#111"/><rect x="12" y="-32" width="10" height="6" fill="#111"/><line x1="26" y1="-33" x2="29" y2="-24" stroke="#6d1a2a" stroke-width="2"/>`;
    if (d.hat === "party") h = `<polygon points="10,-29 24,-29 17,-46" fill="#6d1a2a"/><circle cx="17" cy="-46" r="2.5" fill="#111"/>`;
    g += `<g transform="translate(${d.x.toFixed(1)} ${d.y.toFixed(1)}) scale(${(d.flip * d.s).toFixed(2)} ${d.s.toFixed(2)})">
      <ellipse cx="0" cy="0" rx="26" ry="16" fill="#ffcf1f" stroke="#111" stroke-width="1.5"/>
      <path d="M-24,-4 L-34,-12 L-26,4 Z" fill="#ffcf1f" stroke="#111" stroke-width="1.5"/>
      <circle cx="17" cy="-18" r="12" fill="#ffcf1f" stroke="#111" stroke-width="1.5"/>
      <path d="M27,-20 L39,-16 L27,-13 Z" fill="${d.beak}"/>
      <circle cx="20" cy="-21" r="2" fill="#111"/>${h}</g>`;
  }
  const tag = label ? `<text x="12" y="24" font-family="Arial, sans-serif" font-weight="700" font-size="20" fill="#111">${label}</text>` : "";
  return `<svg class="pond" viewBox="0 0 ${L.W} ${L.H}" role="img" aria-label="A pond full of rubber ducks${label ? ", " + label : ""}">${tag}${g}</svg>`;
}

function pondSvg(c) { return drawPond(pondLayout(c)); }

/* Spot the difference: pond B is pond A with c.diffs changes, picked from the seed. */
function spotSvg(c) {
  const A = pondLayout(c), B = pondLayout(c);
  const r = rng(c.seed + 99), n = B.ducks.length, used = new Set();
  const kinds = ["gone", "cap", "flip", "party", "beak", "gone", "cap"];
  for (let k = 0; k < c.diffs; k++) {
    let i; do { i = Math.floor(r() * n); } while (used.has(i) || used.has(i - 1) || used.has(i + 1));
    used.add(i);
    const d = B.ducks[i], kind = kinds[k % kinds.length];
    if (kind === "gone") d.gone = true;
    if (kind === "cap") d.hat = d.hat === "cap" ? "" : "cap";
    if (kind === "party") d.hat = d.hat === "party" ? "" : "party";
    if (kind === "flip") d.flip = -d.flip;
    if (kind === "beak") d.beak = "#6d1a2a";
  }
  return drawPond(A, "Pond A") + drawPond(B, "Pond B");
}

function render() {
  const m = location.hash.match(/^#(h\d+)-(\d)$/);
  if (!m || !HUNTS[m[1]] || !HUNTS[m[1]].challenges[m[2] - 1]) return home();
  const hunt = HUNTS[m[1]], i = m[2] - 1, c = hunt.challenges[i], last = i === hunt.challenges.length - 1;
  const answers = c.type === "ducks" ? [String(c.caps), ["zero","one","two","three","four","five","six","seven","eight","nine","ten"][c.caps]] : c.answers;
    app.innerHTML = `
    <span class="tag">${hunt.name}</span>
    <h2>${c.title}</h2>
    <section class="card">
      <p class="progress">Challenge ${i + 1} of ${hunt.challenges.length}</p>
      <p class="riddle">${c.prompt}</p>
      ${c.type === "ducks" ? pondSvg(c) : ""}${c.type === "spot" ? spotSvg(c) : ""}
      ${c.image ? `<img class="photo" src="${c.image}" alt="${c.imageAlt || "Picture clue"}">` : ""}
      <form id="f" autocomplete="off">
        <input id="ans" placeholder="Your answer" aria-label="Your answer">
        <button type="submit">Check</button>
      </form>
      <p id="msg" class="msg" hidden></p>
      <button type="button" class="ghost" id="hintBtn">Show a hint</button>
      <p id="hint" class="muted" hidden>${c.hint}</p>
      <div id="rev" class="reveal" hidden>
        <strong>${last ? "You've found the duck's hiding place" : "Correct. Here's where to go next"}</strong>
        <p>${c.next}</p>
        ${last ? `<p class="muted">Not there? Someone beat you to it. Better luck in the next hunt.</p>` : `<p class="muted">Scan the next QR code when you find it.</p>`}
      </div>
    </section>`;
  const msg = document.getElementById("msg");
  document.getElementById("hintBtn").onclick = e => { document.getElementById("hint").hidden = false; e.target.hidden = true; };
  document.getElementById("f").onsubmit = e => {
    e.preventDefault();
    const v = norm(document.getElementById("ans").value);
    msg.hidden = false;
    if (answers.map(norm).includes(v)) { msg.className = "msg"; msg.textContent = "That's it."; document.getElementById("rev").hidden = false; document.getElementById("f").hidden = true; document.getElementById("hintBtn").hidden = true; }
    else { msg.className = "msg bad"; msg.textContent = v ? "Not quite. Try again." : "Type an answer first."; }
  };
}

function home() {
  app.innerHTML = `
    <span class="tag">Term 4 staffroom challenge</span>
    <h1>The CMC <span class="gold">Duck Hunt</span></h1>
    <section class="card">
      <p>Somewhere in the staffroom, a rubber duck is hiding. Twice a week a new hunt goes live.</p>
      <ul>
        <li>Each hunt has three challenges. Press Start to open the first one, and each correct answer tells you where the next QR code is hidden.</li>
        <li>The third challenge reveals where the duck is roosting.</li>
        <li>First to the duck keeps it on their desk.</li>
        <li>Most ducks by the last week of term wins a secret present.</li>
        <li>Leave every QR code where you found it so others can play.</li>
      </ul>
      ${HUNTS[CURRENT_HUNT] ? `<a class="start" href="#${CURRENT_HUNT}-1">Start ${HUNTS[CURRENT_HUNT].name}</a>
      <p class="muted">Challenge 1 tells you where to find the first QR code.</p>` : `<p class="muted">No hunt is running right now. Check back soon.</p>`}
    </section>`;
}

window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
